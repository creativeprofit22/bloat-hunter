<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Magnifying glass body -->
  <circle cx="220" cy="220" r="100" fill="none" stroke="url(#accent)" stroke-width="24"/>
  <!-- Magnifying glass handle -->
  <line x1="295" y1="295" x2="400" y2="400" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
  <!-- Crosshair inside lens -->
  <line x1="220" y1="170" x2="220" y2="270" stroke="#e94560" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="170" y1="220" x2="270" y2="220" stroke="#e94560" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <!-- "B" letter -->
  <text x="390" y="180" font-family="Arial,sans-serif" font-weight="bold" font-size="120" fill="#e94560" opacity="0.3">B</text>
</svg>
